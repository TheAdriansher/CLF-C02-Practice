<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz CLF-C02 (no oficial)</title>
<meta name="description" content="Banco de preguntas originales para practicar el examen AWS Certified Cloud Practitioner (CLF-C02). Proyecto no oficial.">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #5b6675; --line: #d9dee5;
  --accent: #1f5fbf; --accent-text: #ffffff; --ok: #1e7b45; --ok-bg: #e5f4ea;
  --bad: #b3261e; --bad-bg: #fbe9e7; --warn-bg: #fff5d6; --focus: #f2a900;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c; --card: #1b212a; --text: #e8ecf1; --muted: #9aa6b5; --line: #2e3744;
    --accent: #6ea8fe; --accent-text: #0b1726; --ok: #6fd39a; --ok-bg: #16301f;
    --bad: #ff8a80; --bad-bg: #3a1c1a; --warn-bg: #3a3014; --focus: #ffcb47;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.4rem; margin: 8px 0 4px; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
.muted { color: var(--muted); font-size: .9rem; }
.notice { background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; font-size: .9rem; margin: 12px 0; }
fieldset { border: 0; padding: 0; margin: 0 0 14px; }
legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; cursor: pointer; }
.choice input { margin-top: 4px; flex: none; }
.choice.sel { border-color: var(--accent); }
.choice.ok { border-color: var(--ok); background: var(--ok-bg); }
.choice.bad { border-color: var(--bad); background: var(--bad-bg); }
.choice.dis { cursor: default; }
select, button { font: inherit; }
select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); width: 100%; }
button { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.tag { display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.explain { margin-top: 12px; padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--bg); border-radius: 6px; }
.score { font-size: 2.2rem; font-weight: 700; margin: 4px 0; }
table { width: 100%; border-collapse: collapse; margin: 8px 0; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: .95rem; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.low { color: var(--bad); }
a { color: var(--accent); }
.q-text { font-size: 1.05rem; margin: 8px 0 12px; }
.review-item { border-top: 1px solid var(--line); padding: 12px 0; }
.visually-hidden { position: absolute; left: -9999px; }
</style>
</head>
<body>
<main>
  <h1>Quiz CLF-C02</h1>
  <p class="muted">Práctica para AWS Certified Cloud Practitioner. Proyecto no oficial.</p>
  <div id="app" aria-live="polite"></div>
  <p class="muted" style="margin-top:24px">Proyecto no oficial y sin afiliación con Amazon Web Services. Las preguntas son originales y no provienen del examen real. Los servicios y precios cambian: verifica siempre en la documentación oficial de AWS.</p>
</main>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
